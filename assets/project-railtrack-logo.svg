<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="railBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141f36" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080e1a" />
    </linearGradient>
    <linearGradient id="railOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#FF9E44" />
    </linearGradient>
    <linearGradient id="railCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="railGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="120" height="120" rx="26" fill="url(#railBg)" stroke="rgba(255, 107, 53, 0.35)" stroke-width="2"/>

  <!-- GPS Live Tracking Waves -->
  <path d="M38 24 A36 36 0 0 1 82 24" fill="none" stroke="url(#railCyan)" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
  <path d="M46 30 A24 24 0 0 1 74 30" fill="none" stroke="url(#railOrange)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- Perspective Tracks -->
  <line x1="52" y1="78" x2="32" y2="104" stroke="rgba(255,255,255,0.4)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="68" y1="78" x2="88" y2="104" stroke="rgba(255,255,255,0.4)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="47" y1="86" x2="73" y2="86" stroke="rgba(255, 107, 53, 0.5)" stroke-width="2"/>
  <line x1="39" y1="96" x2="81" y2="96" stroke="rgba(255, 107, 53, 0.7)" stroke-width="2.5"/>

  <!-- Aerodynamic Train Body -->
  <path d="M44 38 C44 32 50 28 60 28 C70 28 76 32 76 38 L76 74 C76 78 72 80 60 80 C48 80 44 78 44 74 Z" 
        fill="#1e293b" stroke="url(#railOrange)" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Train Windshield / Cockpit -->
  <path d="M48 40 C48 36 52 34 60 34 C68 34 72 36 72 40 L72 50 C72 52 68 54 60 54 C52 54 48 52 48 50 Z" 
        fill="url(#railCyan)" opacity="0.9"/>
  <line x1="60" y1="34" x2="60" y2="54" stroke="#0f172a" stroke-width="1.5"/>

  <!-- Train Grille / Speed Stripe -->
  <rect x="50" y="60" width="20" height="3" rx="1.5" fill="#FFFFFF" opacity="0.8"/>
  <rect x="52" y="65" width="16" height="2.5" rx="1" fill="#FF6B35"/>

  <!-- Headlights with Glow -->
  <circle cx="50" cy="72" r="3.5" fill="#FFE600" filter="url(#railGlow)"/>
  <circle cx="70" cy="72" r="3.5" fill="#FFE600" filter="url(#railGlow)"/>
</svg>
