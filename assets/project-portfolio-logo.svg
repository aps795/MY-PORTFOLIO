<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="portBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c162e" />
      <stop offset="50%" stop-color="#111728" />
      <stop offset="100%" stop-color="#080c16" />
    </linearGradient>
    <linearGradient id="portOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#FFA26B" />
    </linearGradient>
    <linearGradient id="portVioletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="portCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="portNeonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Badge Card -->
  <rect width="120" height="120" rx="26" fill="url(#portBgGrad)" stroke="rgba(255, 107, 53, 0.4)" stroke-width="2"/>

  <!-- Developer Terminal / Dashboard Window Frame -->
  <rect x="22" y="24" width="76" height="72" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>
  
  <!-- Window Header Bar -->
  <path d="M22 36 L22 36 C22 29.37 27.37 24 34 24 L86 24 C92.63 24 98 29.37 98 36 L98 38 L22 38 Z" fill="rgba(255, 107, 53, 0.18)"/>
  
  <!-- Window Control Traffic Lights -->
  <circle cx="32" cy="31" r="2.8" fill="#EF4444"/>
  <circle cx="40" cy="31" r="2.8" fill="#F59E0B"/>
  <circle cx="48" cy="31" r="2.8" fill="#10B981"/>

  <!-- Sub-window Layout Dashboard Mini-Bar -->
  <rect x="58" y="29" width="30" height="4" rx="2" fill="rgba(255,255,255,0.2)"/>

  <!-- Bold Code Brackets < / > -->
  <!-- Left Bracket < -->
  <path d="M44 52 L34 62 L44 72" fill="none" stroke="url(#portOrangeGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#portNeonGlow)"/>
  
  <!-- Center Neon Slash / -->
  <line x1="64" y1="48" x2="56" y2="76" stroke="url(#portCyanGrad)" stroke-width="3" stroke-linecap="round" filter="url(#portNeonGlow)"/>

  <!-- Right Bracket > -->
  <path d="M76 52 L86 62 L76 72" fill="none" stroke="url(#portOrangeGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#portNeonGlow)"/>

  <!-- Bottom Mini Dashboard Status Dots -->
  <circle cx="42" cy="85" r="2" fill="#FFA26B"/>
  <rect x="48" y="83.5" width="24" height="3" rx="1.5" fill="rgba(255,255,255,0.25)"/>
  <circle cx="78" cy="85" r="2" fill="#00E5FF"/>

  <!-- Spark / Innovation Star in Top Corner -->
  <g transform="translate(94, 24) scale(0.8)" filter="url(#portNeonGlow)">
    <path d="M0 -7 Q0 0 7 0 Q0 0 0 7 Q0 0 -7 0 Q0 0 0 -7 Z" fill="#FFA26B"/>
  </g>
</svg>
