<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="acBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171424" />
      <stop offset="50%" stop-color="#100f1c" />
      <stop offset="100%" stop-color="#080710" />
    </linearGradient>
    <linearGradient id="acYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="acOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#FFA26B" />
    </linearGradient>
    <filter id="acGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="340" fill="url(#acBg)"/>

  <!-- Background decorative grid / circles -->
  <g opacity="0.08" stroke="#FBBF24" stroke-width="1.5">
    <circle cx="120" cy="80" r="60" fill="none"/>
    <circle cx="480" cy="240" r="90" fill="none"/>
  </g>

  <!-- Left: Featured Product Card -->
  <g transform="translate(35, 35)">
    <rect width="250" height="270" rx="14" fill="#151726" stroke="rgba(251, 191, 36, 0.3)" stroke-width="1.5"/>
    
    <!-- Product Header / Badge -->
    <rect x="16" y="16" width="62" height="22" rx="6" fill="rgba(255, 107, 53, 0.2)" stroke="rgba(255, 107, 53, 0.4)" stroke-width="1"/>
    <text x="24" y="31" fill="#FF9268" font-family="Inter, sans-serif" font-size="9.5" font-weight="700">NEW IN</text>

    <!-- Product Visual / HappyShop Cart Icon Container -->
    <g transform="translate(65, 45)">
      <rect width="120" height="95" rx="12" fill="#1e1f33" stroke="rgba(255,255,255,0.06)"/>
      <!-- HappyShop Cart Icon Art -->
      <path d="M35 32 L44 32 L55 64 L86 64 L94 42 L48 42" fill="none" stroke="url(#acYellow)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M52 50 Q66 59 78 50" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="56" cy="74" r="5" fill="url(#acYellow)"/>
      <circle cx="83" cy="74" r="5" fill="url(#acYellow)"/>
    </g>

    <!-- Product Info -->
    <text x="18" y="162" fill="#F1F5F9" font-family="Inter, sans-serif" font-size="13" font-weight="700">Smart Sound Headset</text>
    <text x="18" y="178" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10">Wireless • Noise Cancelling • BT 5.3</text>
    
    <!-- Price Row -->
    <text x="18" y="206" fill="#FBBF24" font-family="Inter, sans-serif" font-size="16" font-weight="800">$149.00</text>
    <text x="92" y="206" fill="#64748B" font-family="Inter, sans-serif" font-size="12" text-decoration="line-through">$199.00</text>

    <!-- Add to Cart Button -->
    <rect x="18" y="222" width="214" height="34" rx="8" fill="url(#acOrange)"/>
    <text x="82" y="243" fill="#080710" font-family="Inter, sans-serif" font-size="11" font-weight="700">🛒 Add To Cart</text>
  </g>

  <!-- Right: Shopping Cart & Checkout Breakdown Card -->
  <g transform="translate(310, 35)">
    <rect width="255" height="270" rx="14" fill="#111322" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>
    
    <text x="20" y="32" fill="#F1F5F9" font-family="Inter, sans-serif" font-size="13" font-weight="700">Shopping Cart (2 items)</text>
    <circle cx="225" cy="27" r="9" fill="#10B981"/>
    <text x="221" y="31" fill="#080710" font-family="Inter, sans-serif" font-size="10" font-weight="800">✓</text>
    <line x1="20" y1="44" x2="235" y2="44" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Cart Item 1 -->
    <g transform="translate(20, 56)">
      <rect width="215" height="38" rx="8" fill="#181c2f"/>
      <text x="12" y="23" fill="#F1F5F9" font-family="Inter, sans-serif" font-size="10.5" font-weight="600">🎧 Smart Sound Headset</text>
      <text x="175" y="23" fill="#FBBF24" font-family="Inter, sans-serif" font-size="11" font-weight="700">$149</text>
    </g>

    <!-- Cart Item 2 -->
    <g transform="translate(20, 102)">
      <rect width="215" height="38" rx="8" fill="#181c2f"/>
      <text x="12" y="23" fill="#F1F5F9" font-family="Inter, sans-serif" font-size="10.5" font-weight="600">⌚ FitPulse Pro Watch</text>
      <text x="175" y="23" fill="#FBBF24" font-family="Inter, sans-serif" font-size="11" font-weight="700">$60</text>
    </g>

    <!-- Price Summary -->
    <g transform="translate(20, 150)" font-family="Inter, sans-serif" font-size="10.5">
      <text y="15" fill="#94A3B8">Subtotal</text> <text x="175" y="15" fill="#F1F5F9">$209.00</text>
      <text y="32" fill="#94A3B8">Discount (PROMO)</text> <text x="170" y="32" fill="#10B981">-$20.00</text>
      <line x1="0" y1="42" x2="215" y2="42" stroke="rgba(255,255,255,0.08)"/>
      <text y="58" fill="#F1F5F9" font-weight="700" font-size="12">Total</text> <text x="160" y="58" fill="#10B981" font-weight="800" font-size="13">$189.00</text>
    </g>

    <!-- Checkout Button -->
    <rect x="20" y="222" width="215" height="34" rx="8" fill="#10B981"/>
    <text x="80" y="243" fill="#061f14" font-family="Inter, sans-serif" font-size="11" font-weight="700">Checkout →</text>
  </g>
</svg>
