<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="ptGradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141829" />
      <stop offset="50%" stop-color="#0e1322" />
      <stop offset="100%" stop-color="#080b15" />
    </linearGradient>
    <linearGradient id="ptOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#FFA26B" />
    </linearGradient>
    <linearGradient id="ptPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="ptGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="340" fill="url(#ptGradBg)"/>

  <!-- Code ambient pattern -->
  <g opacity="0.08" fill="#ffffff" font-family="Courier, monospace" font-size="11">
    <text x="20" y="30">&lt;portfolio&gt;</text>
    <text x="40" y="50">const developer = { name: "Abhishek", skills: ["AI", "Web"] };</text>
    <text x="40" y="70">renderDashboard(developer);</text>
    <text x="20" y="90">&lt;/portfolio&gt;</text>
  </g>

  <!-- Left: Developer Code Editor Window -->
  <g transform="translate(40, 45)">
    <rect width="250" height="250" rx="14" fill="#0d1424" stroke="rgba(255, 107, 53, 0.3)" stroke-width="1.5"/>
    <rect width="250" height="34" rx="14" fill="rgba(255, 255, 255, 0.03)"/>
    <circle cx="20" cy="17" r="4" fill="#EF4444"/>
    <circle cx="32" cy="17" r="4" fill="#F59E0B"/>
    <circle cx="44" cy="17" r="4" fill="#10B981"/>
    <text x="60" y="21" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10.5" font-weight="600">portfolio.jsx — React / Modern Web</text>

    <!-- Code lines -->
    <g transform="translate(18, 48)" font-family="Consolas, Monaco, monospace" font-size="10.5">
      <text y="15" fill="#64748B">01</text> <text x="25" y="15" fill="#EC4899">import</text> <text x="70" y="15" fill="#F1F5F9">{ Portfolio }</text>
      <text y="35" fill="#64748B">02</text> <text x="25" y="35" fill="#EC4899">export default</text> <text x="120" y="35" fill="#38BDF8">function</text> <text x="175" y="35" fill="#FFA26B">App</text><text x="195" y="35" fill="#F1F5F9">() {</text>
      <text y="55" fill="#64748B">03</text> <text x="35" y="55" fill="#38BDF8">const</text> <text x="75" y="55" fill="#F1F5F9">role = </text><text x="125" y="55" fill="#10B981">"AI Developer"</text><text x="210" y="55" fill="#F1F5F9">;</text>
      <text y="75" fill="#64748B">04</text> <text x="35" y="75" fill="#EC4899">return</text> <text x="80" y="75" fill="#F1F5F9">(</text>
      <text y="95" fill="#64748B">05</text> <text x="45" y="95" fill="#38BDF8">&lt;Dashboard</text> <text x="120" y="95" fill="#FFA26B">theme</text><text x="155" y="95" fill="#F1F5F9">=</text><text x="162" y="95" fill="#10B981">"dark"</text><text x="198" y="95" fill="#38BDF8">&gt;</text>
      <text y="115" fill="#64748B">06</text> <text x="55" y="115" fill="#38BDF8">&lt;Projects</text> <text x="120" y="115" fill="#FFA26B">status</text><text x="160" y="115" fill="#F1F5F9">=</text><text x="168" y="115" fill="#10B981">"live"</text> <text x="200" y="115" fill="#38BDF8">/&gt;</text>
      <text y="135" fill="#64748B">07</text> <text x="55" y="135" fill="#38BDF8">&lt;Certifications</text> <text x="150" y="135" fill="#FFA26B">total</text><text x="180" y="135" fill="#F1F5F9">=</text><text x="188" y="135" fill="#38BDF8">{8}</text> <text x="205" y="135" fill="#38BDF8">/&gt;</text>
      <text y="155" fill="#64748B">08</text> <text x="45" y="155" fill="#38BDF8">&lt;/Dashboard&gt;</text>
      <text y="175" fill="#64748B">09</text> <text x="25" y="175" fill="#F1F5F9">);</text>
      <text y="195" fill="#64748B">10</text> <text x="25" y="195" fill="#F1F5F9">}</text>
    </g>
  </g>

  <!-- Right: Portfolio Live Dashboard Preview -->
  <g transform="translate(315, 45)">
    <rect width="245" height="250" rx="14" fill="#0f192c" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1.5"/>
    <text x="20" y="30" fill="#F1F5F9" font-family="Inter, sans-serif" font-size="13" font-weight="700">Developer Dashboard</text>
    
    <!-- Profile Mini Summary -->
    <g transform="translate(20, 45)">
      <circle cx="20" cy="20" r="18" fill="url(#ptOrange)"/>
      <text x="13" y="26" fill="#081021" font-family="Inter, sans-serif" font-size="13" font-weight="700">APS</text>
      <text x="48" y="17" fill="#F1F5F9" font-family="Inter, sans-serif" font-size="11.5" font-weight="700">Abhishek Pratap Singh</text>
      <text x="48" y="32" fill="#94A3B8" font-family="Inter, sans-serif" font-size="9.5">AI/ML & Full-Stack Developer</text>
    </g>

    <!-- Metrics row -->
    <g transform="translate(20, 100)">
      <rect width="64" height="42" rx="8" fill="rgba(255, 107, 53, 0.12)" stroke="rgba(255, 107, 53, 0.3)" stroke-width="1"/>
      <text x="12" y="20" fill="#FF9268" font-family="Inter, sans-serif" font-size="13" font-weight="700">5+</text>
      <text x="10" y="33" fill="#94A3B8" font-family="Inter, sans-serif" font-size="8">Projects</text>

      <rect x="72" width="64" height="42" rx="8" fill="rgba(139, 92, 246, 0.12)" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1"/>
      <text x="84" y="20" fill="#A78BFA" font-family="Inter, sans-serif" font-size="13" font-weight="700">8</text>
      <text x="76" y="33" fill="#94A3B8" font-family="Inter, sans-serif" font-size="8">Certificates</text>

      <rect x="144" width="64" height="42" rx="8" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
      <text x="154" y="20" fill="#34D399" font-family="Inter, sans-serif" font-size="13" font-weight="700">100+</text>
      <text x="148" y="33" fill="#94A3B8" font-family="Inter, sans-serif" font-size="8">Problems</text>
    </g>

    <!-- Performance / Score Graph -->
    <g transform="translate(20, 160)">
      <rect width="208" height="70" rx="8" fill="#132034"/>
      <text x="12" y="20" fill="#94A3B8" font-family="Inter, sans-serif" font-size="9.5">Code Quality & Optimization</text>
      <rect x="12" y="32" width="184" height="8" rx="4" fill="#1e293b"/>
      <rect x="12" y="32" width="160" height="8" rx="4" fill="url(#ptOrange)"/>
      <text x="12" y="55" fill="#10B981" font-family="Inter, sans-serif" font-size="9">✓ 100% Responsive • Accessible • Fast</text>
    </g>
  </g>
</svg>
