<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="ptbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141829" />
      <stop offset="50%" stop-color="#0e1322" />
      <stop offset="100%" stop-color="#080b15" />
    </linearGradient>
    <linearGradient id="ptbOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#FFA26B" />
    </linearGradient>
    <linearGradient id="ptbPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="ptbGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="340" fill="url(#ptbBg)"/>

  <!-- Hexagon geometric background pattern -->
  <g opacity="0.08" stroke="#8B5CF6" stroke-width="1.5">
    <polygon points="50,40 70,30 90,40 90,60 70,70 50,60" fill="none"/>
    <polygon points="100,60 120,50 140,60 140,80 120,90 100,80" fill="none"/>
    <polygon points="480,220 500,210 520,220 520,240 500,250 480,240" fill="none"/>
  </g>

  <!-- Left: Developer Code Editor Window -->
  <g transform="translate(35, 35)">
    <rect width="250" height="270" rx="14" fill="#0d1424" stroke="rgba(255, 107, 53, 0.3)" stroke-width="1.5"/>
    <rect width="250" height="36" rx="14" fill="rgba(255, 255, 255, 0.03)"/>
    <circle cx="20" cy="18" r="4.5" fill="#EF4444"/>
    <circle cx="34" cy="18" r="4.5" fill="#F59E0B"/>
    <circle cx="48" cy="18" r="4.5" fill="#10B981"/>
    <text x="66" y="22" fill="#94A3B8" font-family="Inter, sans-serif" font-size="10.5" font-weight="600">portfolio.jsx — Modern Web</text>

    <!-- Code lines -->
    <g transform="translate(18, 52)" font-family="Consolas, Monaco, monospace" font-size="10.5">
      <text y="15" fill="#64748B">01</text> <text x="25" y="15" fill="#EC4899">import</text> <text x="70" y="15" fill="#F1F5F9">{ Portfolio }</text>
      <text y="35" fill="#64748B">02</text> <text x="25" y="35" fill="#EC4899">export default</text> <text x="120" y="35" fill="#38BDF8">function</text> <text x="175" y="35" fill="#FFA26B">App</text><text x="195" y="35" fill="#F1F5F9">() {</text>
      <text y="55" fill="#64748B">03</text> <text x="35" y="55" fill="#38BDF8">const</text> <text x="75" y="55" fill="#F1F5F9">role = </text><text x="125" y="55" fill="#10B981">"AI Developer"</text><text x="210" y="55" fill="#F1F5F9">;</text>
      <text y="75" fill="#64748B">04</text> <text x="35" y="75" fill="#EC4899">return</text> <text x="80" y="75" fill="#F1F5F9">(</text>
      <text y="95" fill="#64748B">05</text> <text x="45" y="95" fill="#38BDF8">&lt;Dashboard</text> <text x="120" y="95" fill="#FFA26B">theme</text><text x="155" y="95" fill="#F1F5F9">=</text><text x="162" y="95" fill="#10B981">"dark"</text><text x="198" y="95" fill="#38BDF8">&gt;</text>
      <text y="115" fill="#64748B">06</text> <text x="55" y="115" fill="#38BDF8">&lt;Projects</text> <text x="120" y="115" fill="#FFA26B">status</text><text x="160" y="115" fill="#F1F5F9">=</text><text x="168" y="115" fill="#10B981">"live"</text> <text x="200" y="115" fill="#38BDF8">/&gt;</text>
      <text y="135" fill="#64748B">07</text> <text x="55" y="135" fill="#38BDF8">&lt;Certifications</text> <text x="150" y="135" fill="#FFA26B">total</text><text x="180" y="135" fill="#F1F5F9">=</text><text x="188" y="135" fill="#38BDF8">{8}</text> <text x="205" y="135" fill="#38BDF8">/&gt;</text>
      <text y="155" fill="#64748B">08</text> <text x="45" y="155" fill="#38BDF8">&lt;/Dashboard&gt;</text>
      <text y="175" fill="#64748B">09</text> <text x="25" y="175" fill="#F1F5F9">);</text>
      <text y="195" fill="#64748B">10</text> <text x="25" y="195" fill="#F1F5F9">}</text>
    </g>
  </g>

  <!-- Right: Hexagon Brand & Developer Dashboard Card -->
  <g transform="translate(310, 35)">
    <rect width="255" height="270" rx="14" fill="#0f192c" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1.5"/>
    <text x="20" y="32" fill="#F1F5F9" font-family="Inter, sans-serif" font-size="13" font-weight="700">Developer Dashboard</text>
    
    <!-- Profile Mini Summary with Hexagon Brand Mark -->
    <g transform="translate(20, 48)">
      <!-- Hexagon Cluster Icon -->
      <polygon points="12,18 20,12 28,18 28,28 20,34 12,28" fill="#8B5CF6"/>
      <polygon points="26,18 34,12 42,18 42,28 34,34 26,28" fill="#38BDF8"/>
      
      <text x="50" y="20" fill="#F1F5F9" font-family="Inter, sans-serif" font-size="11.5" font-weight="700">Abhishek Pratap Singh</text>
      <text x="50" y="34" fill="#94A3B8" font-family="Inter, sans-serif" font-size="9.5">AI/ML &amp; Full-Stack Developer</text>
    </g>

    <!-- Metrics row -->
    <g transform="translate(20, 105)">
      <rect width="66" height="44" rx="8" fill="rgba(255, 107, 53, 0.12)" stroke="rgba(255, 107, 53, 0.3)" stroke-width="1"/>
      <text x="14" y="22" fill="#FF9268" font-family="Inter, sans-serif" font-size="13" font-weight="700">5+</text>
      <text x="12" y="35" fill="#94A3B8" font-family="Inter, sans-serif" font-size="8">Projects</text>

      <rect x="74" width="66" height="44" rx="8" fill="rgba(139, 92, 246, 0.12)" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1"/>
      <text x="88" y="22" fill="#A78BFA" font-family="Inter, sans-serif" font-size="13" font-weight="700">8</text>
      <text x="78" y="35" fill="#94A3B8" font-family="Inter, sans-serif" font-size="8">Certificates</text>

      <rect x="148" width="66" height="44" rx="8" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
      <text x="158" y="22" fill="#34D399" font-family="Inter, sans-serif" font-size="13" font-weight="700">100+</text>
      <text x="152" y="35" fill="#94A3B8" font-family="Inter, sans-serif" font-size="8">Problems</text>
    </g>

    <!-- Performance & Quality Score -->
    <g transform="translate(20, 168)">
      <rect width="214" height="74" rx="8" fill="#132034"/>
      <text x="12" y="22" fill="#94A3B8" font-family="Inter, sans-serif" font-size="9.5">Code Quality &amp; Optimization</text>
      <rect x="12" y="34" width="190" height="8" rx="4" fill="#1e293b"/>
      <rect x="12" y="34" width="168" height="8" rx="4" fill="url(#ptbOrange)"/>
      <text x="12" y="58" fill="#10B981" font-family="Inter, sans-serif" font-size="9">✓ 100% Responsive • Accessible • Fast</text>
    </g>
