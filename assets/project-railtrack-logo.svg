<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="rtBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1a2f" />
      <stop offset="50%" stop-color="#0a1222" />
      <stop offset="100%" stop-color="#040812" />
    </linearGradient>
    <linearGradient id="rtOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#FFA26B" />
    </linearGradient>
    <linearGradient id="rtCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="rtNeonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Badge Card -->
  <rect width="120" height="120" rx="26" fill="url(#rtBgGrad)" stroke="rgba(255, 107, 53, 0.4)" stroke-width="2"/>
  
  <!-- Outer Live Radar Tracking Waves -->
  <path d="M32 26 A42 42 0 0 1 88 26" fill="none" stroke="url(#rtCyanGrad)" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
  <path d="M42 32 A26 26 0 0 1 78 32" fill="none" stroke="url(#rtOrangeGrad)" stroke-width="2.2" stroke-linecap="round" opacity="0.85"/>
  
  <!-- Perspective Railway Tracks -->
  <line x1="52" y1="78" x2="28" y2="108" stroke="rgba(255,255,255,0.45)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="68" y1="78" x2="92" y2="108" stroke="rgba(255,255,255,0.45)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Track Ties / Sleepers -->
  <line x1="47" y1="84" x2="73" y2="84" stroke="rgba(255, 107, 53, 0.6)" stroke-width="2"/>
  <line x1="41" y1="92" x2="79" y2="92" stroke="rgba(255, 107, 53, 0.75)" stroke-width="2.5"/>
  <line x1="33" y1="102" x2="87" y2="102" stroke="url(#rtOrangeGrad)" stroke-width="3"/>

  <!-- High-Speed Locomotive Body -->
  <path d="M43 40 C43 32 50 26 60 26 C70 26 77 32 77 40 L77 74 C77 78 72 80 60 80 C48 80 43 78 43 74 Z" 
        fill="#131e33" stroke="url(#rtOrangeGrad)" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Train Aerodynamic Cockpit Windshield -->
  <path d="M47 40 C47 35 52 32 60 32 C68 32 73 35 73 40 L73 50 C73 53 68 55 60 55 C52 55 47 53 47 50 Z" 
        fill="url(#rtCyanGrad)" opacity="0.95"/>
  <line x1="60" y1="32" x2="60" y2="55" stroke="#0b1322" stroke-width="1.8"/>

  <!-- Center Speed Stripe & Cowcatcher Grille -->
  <rect x="50" y="60" width="20" height="3" rx="1.5" fill="#FFFFFF" opacity="0.9"/>
  <rect x="52" y="65" width="16" height="2.5" rx="1.25" fill="#FF6B35"/>

  <!-- Glowing Headlights -->
  <circle cx="49" cy="73" r="3.5" fill="#FFE600" filter="url(#rtNeonGlow)"/>
  <circle cx="71" cy="73" r="3.5" fill="#FFE600" filter="url(#rtNeonGlow)"/>

  <!-- Live GPS Beacon Pulse on Top -->
  <circle cx="60" cy="22" r="3" fill="#FF6B35" filter="url(#rtNeonGlow)"/>
  <circle cx="60" cy="22" r="1" fill="#FFFFFF"/>
</svg>
