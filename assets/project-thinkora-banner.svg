<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="tkGradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>
    <linearGradient id="tkOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#FFA26B" />
    </linearGradient>
    <linearGradient id="tkCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="tkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" fill="url(#tkGradBg)"/>
  
  <!-- Subtle Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="68" x2="600" y2="68"/>
    <line x1="0" y1="136" x2="600" y2="136"/>
    <line x1="0" y1="204" x2="600" y2="204"/>
    <line x1="0" y1="272" x2="600" y2="272"/>
    <line x1="120" y1="0" x2="120" y2="340"/>
    <line x1="240" y1="0" x2="240" y2="340"/>
    <line x1="360" y1="0" x2="360" y2="340"/>
    <line x1="480" y1="0" x2="480" y2="340"/>
  </g>

  <!-- Ambient Glow Circles -->
  <circle cx="150" cy="170" r="120" fill="#FF6B35" opacity="0.12" filter="url(#tkGlow)"/>
  <circle cx="450" cy="150" r="100" fill="#06B6D4" opacity="0.1" filter="url(#tkGlow)"/>

  <!-- Left: AI Assistant Visual Hologram -->
  <g transform="translate(60, 50)">
    <!-- Circuit lines -->
    <path d="M40 70 L90 70 L120 110 L160 110" fill="none" stroke="rgba(255, 107, 53, 0.4)" stroke-width="2"/>
    <path d="M70 180 L110 180 L140 140 L180 140" fill="none" stroke="rgba(6, 182, 212, 0.4)" stroke-width="2"/>
    
    <!-- Central AI Core -->
    <circle cx="100" cy="120" r="50" fill="rgba(15, 23, 42, 0.8)" stroke="url(#tkOrange)" stroke-width="2"/>
    <circle cx="100" cy="120" r="38" fill="none" stroke="rgba(6, 182, 212, 0.5)" stroke-dasharray="6 4"/>
    
    <!-- Bot Avatar Icon -->
    <circle cx="100" cy="115" r="18" fill="rgba(255, 107, 53, 0.2)"/>
    <path d="M92 110 C92 104 96 100 100 100 C104 100 108 104 108 110 L108 122 C108 124 104 126 100 126 C96 126 92 124 92 122 Z" fill="url(#tkOrange)"/>
    <circle cx="97" cy="112" r="2" fill="#FFFFFF"/>
    <circle cx="103" cy="112" r="2" fill="#FFFFFF"/>
    <line x1="100" y1="100" x2="100" y2="94" stroke="#FF6B35" stroke-width="2"/>
    <circle cx="100" cy="93" r="2.5" fill="#00E5FF"/>
  </g>

  <!-- Right: Chatbot Dialogue Window Mockup -->
  <g transform="translate(280, 45)">
    <!-- Window Frame -->
    <rect width="270" height="250" rx="14" fill="#0b1322" stroke="rgba(255, 107, 53, 0.3)" stroke-width="1.5"/>
    <!-- Window Header -->
    <rect width="270" height="38" rx="14" fill="rgba(255, 255, 255, 0.03)"/>
    <circle cx="20" cy="19" r="4" fill="#EF4444"/>
    <circle cx="32" cy="19" r="4" fill="#F59E0B"/>
    <circle cx="44" cy="19" r="4" fill="#10B981"/>
    <text x="60" y="23" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11" font-weight="600">Thinkora AI • Online</text>
    <circle cx="175" cy="19" r="3" fill="#10B981"/>

    <!-- User Chat Bubble (Right) -->
    <rect x="70" y="55" width="185" height="42" rx="10" fill="#1e293b"/>
    <text x="82" y="73" fill="#E2E8F0" font-family="Inter, sans-serif" font-size="11">How can NLP help learning?</text>
    <text x="82" y="88" fill="#64748B" font-family="Inter, sans-serif" font-size="9">10:42 AM</text>

    <!-- Bot Chat Bubble (Left) with Orange Accent -->
    <rect x="15" y="110" width="240" height="78" rx="10" fill="rgba(255, 107, 53, 0.12)" stroke="rgba(255, 107, 53, 0.3)" stroke-width="1"/>
    <text x="28" y="130" fill="#FF9268" font-family="Inter, sans-serif" font-size="10" font-weight="700">🤖 Thinkora Assistant</text>
    <text x="28" y="148" fill="#F1F5F9" font-family="Inter, sans-serif" font-size="10.5">By combining semantic retrieval</text>
    <text x="28" y="164" fill="#F1F5F9" font-family="Inter, sans-serif" font-size="10.5">with fast response synthesis!</text>
    <text x="28" y="180" fill="#94A3B8" font-family="Inter, sans-serif" font-size="8.5">Accuracy: 98.4% • Latency: 120ms</text>

    <!-- Interactive Input Bar -->
    <rect x="15" y="200" width="240" height="36" rx="18" fill="#151e30" stroke="rgba(255, 255, 255, 0.1)"/>
    <text x="32" y="222" fill="#64748B" font-family="Inter, sans-serif" font-size="11">Type your question...</text>
    <circle cx="235" cy="218" r="12" fill="url(#tkOrange)"/>
    <path d="M232 214 L239 218 L232 222 Z" fill="#081021"/>
  </g>
</svg>
