<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="portBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f182c" />
      <stop offset="50%" stop-color="#121727" />
      <stop offset="100%" stop-color="#0a0e1a" />
    </linearGradient>
    <linearGradient id="portOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#FFA26B" />
    </linearGradient>
    <linearGradient id="portPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="portGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="120" height="120" rx="26" fill="url(#portBg)" stroke="rgba(255, 107, 53, 0.35)" stroke-width="2"/>

  <!-- Terminal / Portfolio Window Header -->
  <rect x="26" y="28" width="68" height="64" rx="10" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <rect x="26" y="28" width="68" height="16" rx="10" fill="rgba(255, 107, 53, 0.15)"/>
  
  <!-- Window control dots -->
  <circle cx="35" cy="36" r="2.5" fill="#EF4444"/>
  <circle cx="43" cy="36" r="2.5" fill="#F59E0B"/>
  <circle cx="51" cy="36" r="2.5" fill="#10B981"/>

  <!-- Code Brackets < / > -->
  <!-- Left Bracket < -->
  <path d="M47 54 L38 62 L47 70" fill="none" stroke="url(#portOrange)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#portGlow)"/>
  
  <!-- Slash / -->
  <line x1="63" y1="52" x2="57" y2="72" stroke="url(#portPurple)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Right Bracket > -->
  <path d="M73 54 L82 62 L73 70" fill="none" stroke="url(#portOrange)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#portGlow)"/>

  <!-- Sparkle / Star in corner -->
  <g transform="translate(86, 28) scale(0.7)" filter="url(#portGlow)">
    <path d="M0 -8 Q0 0 8 0 Q0 0 0 8 Q0 0 -8 0 Q0 0 0 -8 Z" fill="#FFA26B"/>
  </g>
</svg>
